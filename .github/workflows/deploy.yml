name: Deploy House Designer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript
        run: |
          node --check app.js
          node --check geometry.js
          node --check designer.js
          node --check interior.js
          node --check pwa.js
          node --check sw.js
          node tests/geometry.cjs
          node tests/project.cjs
          node tests/interior.cjs
      - uses: actions/configure-pages@v5
      - name: Assemble website
        run: |
          mkdir _site
          cp index.html styles.css app.js geometry.js designer.js interior.js pwa.js sw.js manifest.webmanifest _site/
          cp -r icons assets _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
